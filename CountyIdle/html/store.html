<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f2ede4;
            --ink: #2c2c2c;
            --seal: #b22222;
            --jade: #cbdcd0;
        }

        body {
            background-color: var(--paper);
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
            font-family: 'Noto Serif SC', serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 4vh;
        }

        .font-calligraphy { font-family: 'Ma Shan Zheng', cursive; }

        /* --- 顶部标题 --- */
        .header {
            border-bottom: 2px solid var(--ink);
            padding-bottom: 1vh;
            margin-bottom: 4vh;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        /* --- 主布局 --- */
        .archive-container {
            display: flex;
            flex: 1;
            gap: 4vw;
            height: 70vh;
        }

        /* --- 左侧：玉简列表 --- */
        .jade-list {
            width: 30vw;
            overflow-y: auto;
            padding-right: 1vw;
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
        }

        /* 存档项：模拟横放的玉简片 */
        .archive-item {
            background: linear-gradient(90deg, #fdfdfd, #cbdcd0);
            border: 1px solid rgba(0,0,0,0.1);
            padding: 1.5vh 2vw;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .archive-item:hover {
            transform: translateX(10px);
            box-shadow: -5px 0 0 var(--seal);
        }

        .archive-item.active {
            background: linear-gradient(90deg, #fff, #b2d8be);
            box-shadow: -8px 0 0 var(--seal);
        }

        /* --- 右侧：展开的卷轴详情 --- */
        .detail-panel {
            flex: 1;
            background: #fffdf9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 8px;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 3vh;
            border: 1px solid #d4c5a9;
        }

        /* 卷轴轴头装饰 */
        .detail-panel::before, .detail-panel::after {
            content: "";
            position: absolute;
            left: -10px; width: 20px; height: 105%;
            top: -2.5%;
            background: linear-gradient(to bottom, #444, #1a1a1a, #444);
            border-radius: 10px;
        }
        .detail-panel::after { left: auto; right: -10px; }

        .preview-img {
            width: 100%;
            height: 30vh;
            background: #e0e0e0;
            border: 8px solid #fff;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            object-fit: cover;
            margin-bottom: 2vh;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2vh;
            border-top: 1px solid #eee;
            padding-top: 2vh;
        }

        .stat-item {
            border-left: 2px solid var(--jade);
            padding-left: 1vw;
        }

        .stat-label { font-size: 0.8rem; color: #888; }
        .stat-value { font-family: 'Ma Shan Zheng'; font-size: 1.4rem; color: var(--ink); }

        /* --- 动作按钮：印章风格 --- */
        .action-bar {
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
            gap: 2vw;
        }

        .btn-seal {
            width: 80px; height: 80px;
            border: 2px solid var(--seal);
            color: var(--seal);
            display: flex;
            align-items: center; justify-content: center;
            font-family: 'Ma Shan Zheng';
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            clip-path: polygon(5% 0, 95% 3%, 100% 95%, 2% 100%);
        }

        .btn-seal:hover {
            background: var(--seal);
            color: white;
            transform: scale(1.05);
        }

        .btn-danger {
            border-color: #666;
            color: #666;
        }
        .btn-danger:hover { background: #333; }

    </style>
</head>
<body>

    <header class="header">
        <div>
            <h1 class="font-calligraphy text-5xl">天衍峰留影录</h1>
            <p class="text-xs tracking-[0.8em] text-stone-400">CHRONICLES OF TIANYAN PEAK</p>
        </div>
        <div class="text-stone-500 text-sm italic">“因果丝连，旧事历历在目”</div>
    </header>

    <div class="archive-container">
        <!-- 左侧列表 -->
        <div class="jade-list">
            <div class="archive-item active">
                <div>
                    <div class="text-lg font-bold">手动存档 · 壹</div>
                    <div class="text-xs text-stone-500">景禾元年 正月 初二</div>
                </div>
                <div class="font-calligraphy text-stone-400">已选</div>
            </div>
            <div class="archive-item">
                <div>
                    <div class="text-lg font-bold">天道刻印 (自动)</div>
                    <div class="text-xs text-stone-500">景禾元年 正月 初一</div>
                </div>
            </div>
            <!-- 重复更多... -->
        </div>

        <!-- 右侧详述 -->
        <div class="detail-panel">
            <!-- 存档截图 -->
            <div class="preview-img flex items-center justify-center text-stone-400 italic">
                此处显示存档瞬间的留影画面
            </div>

            <div class="flex justify-between items-start mb-4">
                <div>
                    <h2 class="text-2xl font-calligraphy text-stone-800">卷名：自动存档 3</h2>
                    <p class="text-sm text-stone-400">最近落卷：2026-03-15 21:20:25</p>
                </div>
                <div class="bg-stone-100 px-4 py-1 text-xs border border-stone-200">修改卷名</div>
            </div>

            <div class="stat-grid">
                <div class="stat-item">
                    <div class="stat-label">宗门人口</div>
                    <div class="stat-value">111 · 靈</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">灵石储备</div>
                    <div class="stat-value">247 · 錠</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">历练层数</div>
                    <div class="stat-value">五层</div>
                </div>
            </div>

            <div class="action-bar">
                <div class="btn-seal btn-danger">焚毁</div>
                <div class="btn-seal" style="border-color: #8c734b; color: #8c734b;">另拓</div>
                <div class="btn-seal">覆写</div>
                <div class="btn-seal" style="background: var(--seal); color: white;">启读</div>
            </div>
        </div>
    </div>

</body>
</html>
