<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f4f1ea;
            --ink: #2c2c2c;
            --seal: #b22222;
            --gold: #8c734b;
            --jade: #cbdcd0;
            --unit: 1vh;
        }

        body {
            background-color: var(--paper);
            font-family: 'Noto Serif SC', serif;
            height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- 背景纹理与诗文瀑布 (集成之前的效果) --- */
        .paper-overlay {
            position: fixed; inset: 0; z-index: -1;
            background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='paperGrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.04' numOctaves='5' result='noise'/%3E%3CfeDiffuseLighting in='noise' lighting-color='%23f4f1ea' surfaceScale='2'%3E%3CfeDistantLight azimuth='45' elevation='60'/%3E%3C/feDiffuseLighting%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23paperGrain)' opacity='0.5'/%3E%3C/svg%3E");
        }

        .poem-bg {
            position: fixed; top: -10%; writing-mode: vertical-rl;
            color: var(--ink); opacity: 0.04; font-size: 2.5vh;
            letter-spacing: 0.8em; white-space: nowrap; pointer-events: none;
            animation: flow 30s linear infinite; z-index: 0;
        }
        @keyframes flow { from { transform: translateY(0); } to { transform: translateY(110vh); } }

        /* --- 核心布局 --- */
        .settings-wrap {
            width: 85vw; height: 80vh;
            display: flex; gap: 5vw; z-index: 10;
        }

        /* --- 左侧：悬浮玉简导航 --- */
        .nav-jade {
            display: flex; flex-direction: column; gap: 3vh; justify-content: center;
        }
        .jade-tab {
            width: 5vh; height: 22vh;
            background: linear-gradient(135deg, #fdfdfd, #cbdcd0);
            border: 1px solid rgba(140, 115, 75, 0.2);
            border-radius: 2.5vh;
            display: flex; align-items: center; justify-content: center;
            writing-mode: vertical-rl; font-family: 'Ma Shan Zheng';
            font-size: 2.8vh; color: var(--ink); cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            letter-spacing: 0.3em;
        }
        .jade-tab:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .jade-tab.active { 
            background: var(--seal); color: var(--paper); 
            border-color: var(--seal); transform: scale(1.05);
        }

        /* --- 右侧：极简内容区 --- */
        .content-main {
            flex: 1; padding: 2vh 0; display: flex; flex-direction: column;
        }

        .header-title {
            font-family: 'Ma Shan Zheng'; font-size: 8vh;
            color: var(--ink); margin-bottom: 1vh;
        }
        .sub-desc {
            color: var(--gold); font-size: 1.2vh; letter-spacing: 0.5em;
            margin-bottom: 6vh; opacity: 0.6;
        }

        /* --- 交互组件细化 --- */
        .setting-item {
            display: flex; align-items: center; margin-bottom: 5vh;
            border-bottom: 0.5px solid rgba(140, 115, 75, 0.1);
            padding-bottom: 2vh;
        }
        .label-box { width: 15vw; }
        .label-cn { font-size: 2.2vh; font-weight: 700; color: var(--ink); display: block; }
        .label-en { font-size: 1vh; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }

        /* 金丝调节轴 */
        .gold-slider {
            flex: 1; -webkit-appearance: none; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            outline: none;
        }
        .gold-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 1.8vh; height: 1.8vh;
            background: radial-gradient(circle at 30% 30%, #fff, #cbdcd0);
            border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 2px var(--gold);
            cursor: pointer; transition: 0.2s;
        }
        .gold-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }

        /* 朱砂敕令开关 */
        .seal-toggle {
            width: 4vh; height: 4vh; border: 1.5px solid var(--seal);
            border-radius: 50%; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            transition: all 0.3s; position: relative;
        }
        .seal-toggle.on { background: rgba(178, 34, 34, 0.05); box-shadow: inset 0 0 8px rgba(178, 34, 34, 0.2); }
        .seal-toggle::after {
            content: "敕"; font-family: 'Ma Shan Zheng'; color: var(--seal);
            font-size: 2.2vh; opacity: 0; transition: 0.3s;
        }
        .seal-toggle.on::after { opacity: 1; }

        /* 快捷键位 (敕令符) */
        .key-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3vh; }
        .key-box {
            background: rgba(255,255,255,0.4); border: 0.5px solid var(--gold);
            padding: 1.5vh; display: flex; justify-content: space-between; align-items: center;
            transition: 0.3s; cursor: pointer;
        }
        .key-box:hover { background: rgba(255,255,255,0.8); border-color: var(--seal); }
        .key-val { font-family: 'Ma Shan Zheng'; color: var(--seal); font-size: 2vh; }

        /* --- 底部操作：印章 --- */
        .footer {
            margin-top: auto; display: flex; justify-content: flex-end; gap: 3vw;
        }
        .btn-action {
            width: 10vh; height: 10vh; border: 2px solid var(--seal);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Ma Shan Zheng'; font-size: 2.5vh; color: var(--seal);
            cursor: pointer; transition: 0.3s;
            clip-path: polygon(5% 2%, 98% 0%, 95% 98%, 2% 95%);
        }
        .btn-action:hover { background: var(--seal); color: var(--paper); transform: scale(1.1) rotate(-3deg); }

    </style>
</head>
<body>

    <div class="paper-overlay"></div>
    <!-- 瀑布背景示例 -->
    <div class="poem-bg" style="left: 10vw; animation-delay: 0s;">北冥有鱼，其名为鲲。鲲之大，不知其几千里也。</div>
    <div class="poem-bg" style="left: 85vw; animation-delay: -15s;">道可道，非常道；名可名，非常名。上善若水。</div>

    <div class="settings-wrap">
        <!-- 左侧导航：悬浮玉简 -->
        <nav class="nav-jade">
            <div class="jade-tab active">万象声色</div>
            <div class="jade-tab">敕令符节</div>
            <div class="jade-tab">言辞教化</div>
        </nav>

        <!-- 右侧内容 -->
        <div class="content-main">
            <h1 class="header-title">天衍機宜</h1>
            <p class="sub-desc">TIANYAN SECRETS AND STRATEGIES</p>

            <!-- 调节项 1 -->
            <div class="setting-item">
                <div class="label-box">
                    <span class="label-cn">金石交鸣</span>
                    <span class="label-en">SFX VOLUME</span>
                </div>
                <input type="range" class="gold-slider" value="58">
                <span class="font-calligraphy ml-8 text-2xl text-stone-400">盈满</span>
            </div>

            <!-- 调节项 2 -->
            <div class="setting-item">
                <div class="label-box">
                    <span class="label-cn">须弥幻境</span>
                    <span class="label-en">FULLSCREEN MODE</span>
                </div>
                <div class="flex-1"></div>
                <div class="seal-toggle on" onclick="this.classList.toggle('on')"></div>
            </div>

            <!-- 调节项 3 -->
            <div class="setting-item">
                <div class="label-box">
                    <span class="label-cn">灵光显像</span>
                    <span class="label-en">GRAPHICS QUALITY</span>
                </div>
                <div class="flex-1 flex justify-end gap-[5vw] text-[2.6vh]">
                    <span class="text-stone-400 opacity-70">凡胎</span>
                    <span class="text-stone-400 opacity-70">结丹</span>
                    <span class="key-val" style="border-bottom:1px solid currentColor;padding-bottom:0.4vh;">大乘</span>
                </div>
            </div>

            <!-- 调节项 4 -->
            <div class="setting-item" style="border-bottom:none;">
                <div class="label-box">
                    <span class="label-cn">乾坤视野</span>
                    <span class="label-en">RESOLUTION</span>
                </div>
                <div class="flex-1 flex justify-end gap-[4vw] text-[2.3vh]">
                    <span class="text-stone-400 opacity-70">入微 (1080p)</span>
                    <span class="key-val" style="border-bottom:1px solid currentColor;padding-bottom:0.4vh;">清明 (2K)</span>
                    <span class="text-stone-400 opacity-70">通神 (4K)</span>
                </div>
            </div>

            <!-- 底部印章 -->
            <div class="footer">
                <div class="btn-action" style="border-color: #999; color: #999;">作罢</div>
                <div class="btn-action">收录</div>
            </div>
        </div>
    </div>

</body>
</html>
