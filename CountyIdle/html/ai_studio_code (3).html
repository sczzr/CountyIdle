<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f4f1ea;
            --ink: #2c2c2c;
            --cord: #3d2b1f;
            --seal: #b22222;
            --unit: 0.8vh; /* 全局缩放因子，调小了一点防止过大 */
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--paper);
            font-family: 'Noto Serif SC', serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .paper-overlay {
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='paperGrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.04' numOctaves='5' result='noise'/%3E%3CfeDiffuseLighting in='noise' lighting-color='%23f4f1ea' surfaceScale='2'%3E%3CfeDistantLight azimuth='45' elevation='60'/%3E%3C/feDiffuseLighting%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23paperGrain)' opacity='0.5'/%3E%3C/svg%3E");
        }

        .menu-container {
            display: flex;
            gap: calc(10 * var(--unit)); /* 间距由 unit 控制，绝对跟随分辨率 */
            perspective: 1500px;
            z-index: 10;
        }

        .jade-group {
            position: relative;
            width: calc(8 * var(--unit)); /* 玉简宽度动态化 */
            height: calc(36 * var(--unit)); /* 玉简高度动态化 */
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .jade-leaf {
            position: absolute; top: 0; left: 0;
            width: calc(8 * var(--unit));
            height: calc(36 * var(--unit));
            background-image: url("data:image/svg+xml,%3Csvg width='44' height='190' viewBox='0 0 44 190' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='jadeGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23fdfdfd' /%3E%3Cstop offset='100%25' style='stop-color:%23cbdcd0' /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='40' height='186' rx='4' fill='url(%23jadeGrad)' stroke='rgba(0,0,0,0.1)' stroke-width='1'/%3E%3Ccircle cx='22' cy='18' r='3' fill='%233d2b1f' /%3E%3Ccircle cx='22' cy='172' r='3' fill='%233d2b1f' /%3E%3Cpath d='M10 40 Q 22 80 15 150' stroke='rgba(255,255,255,0.5)' fill='none' stroke-width='0.5' /%3E%3C/svg%3E");
            background-size: 100% 100%;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex; align-items: center; justify-content: center;
            writing-mode: vertical-rl;
            font-family: 'Ma Shan Zheng', cursive;
        }

        .main-leaf {
            z-index: 10;
            font-size: calc(2.8 * var(--unit));
            color: var(--ink);
            filter: drop-shadow(0.2vh 0.4vh 0.6vh rgba(0,0,0,0.15));
        }

        .side-leaf {
            z-index: 5;
            font-size: calc(1.8 * var(--unit));
            color: rgba(44,44,44,0.5);
            opacity: 0;
            transform: scaleY(0.95);
        }

        /* 展开位移数值全部绑定 unit，确保永不遮挡 */
        .jade-group:hover .main-leaf { color: var(--seal); transform: translateY(calc(-2 * var(--unit))); }
        .jade-group:hover .leaf-left { opacity: 1; transform: translateX(calc(-8.5 * var(--unit))) scaleY(0.95) rotate(-3deg); }
        .jade-group:hover .leaf-right { opacity: 1; transform: translateX(calc(8.5 * var(--unit))) scaleY(0.95) rotate(3deg); }

        .jade-leaf span { letter-spacing: 0.2em; padding: calc(1.5 * var(--unit)) 0; }

        .title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: calc(9 * var(--unit));
            color: var(--ink);
            letter-spacing: 0.15em;
            margin-bottom: calc(6 * var(--unit));
        }

        /* 印章 */
        .seal-box {
            position: fixed; bottom: calc(4 * var(--unit)); right: calc(4 * var(--unit));
            width: calc(8 * var(--unit)); height: calc(8 * var(--unit));
            border: calc(0.3 * var(--unit)) solid var(--seal);
            display: grid; grid-template-columns: 1fr 1fr;
            color: var(--seal); font-family: 'Ma Shan Zheng', cursive;
            font-size: calc(2.8 * var(--unit)); opacity: 0.7; transform: rotate(-3deg);
        }
        .seal-box div { display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; }
    </style>
</head>
<body>
    <div class="paper-overlay"></div>
    
    <header class="text-center z-10">
        <h1 class="title">山海機局</h1>
        <p class="text-stone-400 tracking-[0.8em] text-[1.2vh] uppercase">Shanhai Chronicles Strategy</p>
    </header>

    <main class="menu-container">
        <!-- 1 -->
        <div class="jade-group">
            <div class="jade-leaf side-leaf leaf-left"><span>云深不知处</span></div>
            <div class="jade-leaf main-leaf"><span>踏入仙途</span></div>
            <div class="jade-leaf side-leaf leaf-right"><span>山海觅长生</span></div>
        </div>
        <!-- 2 -->
        <div class="jade-group">
            <div class="jade-leaf side-leaf leaf-left"><span>梦回旧山河</span></div>
            <div class="jade-leaf main-leaf"><span>往昔因果</span></div>
            <div class="jade-leaf side-leaf leaf-right"><span>缘起落花时</span></div>
        </div>
        <!-- 3 -->
        <div class="jade-group">
            <div class="jade-leaf side-leaf leaf-left"><span>乾坤归造化</span></div>
            <div class="jade-leaf main-leaf"><span>万象方寸</span></div>
            <div class="jade-leaf side-leaf leaf-right"><span>静思理玄机</span></div>
        </div>
        <!-- 4 -->
        <div class="jade-group">
            <div class="jade-leaf side-leaf leaf-left"><span>旁門参造化</span></div>
            <div class="jade-leaf main-leaf"><span>奇門遁甲</span></div>
            <div class="jade-leaf side-leaf leaf-right"><span>幻影变乾坤</span></div>
        </div>
        <!-- 5 -->
        <div class="jade-group">
            <div class="jade-leaf side-leaf leaf-left"><span>挥袖远红尘</span></div>
            <div class="jade-leaf main-leaf"><span>离线归真</span></div>
            <div class="jade-leaf side-leaf leaf-right"><span>拂衣入大荒</span></div>
        </div>
    </main>

    <div class="seal-box">
        <div>谨</div><div>山</div>
        <div>制</div><div>海</div>
    </div>
</body>
</html>
